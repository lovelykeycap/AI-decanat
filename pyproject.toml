[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "ai-decanat"
version = "0.1.0"
description = "Local voice and knowledge orchestration for the dean's office avatar"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3",
  "httpx>=0.28,<1",
  "openai>=2,<3",
  "numpy>=2.1,<3",
  "argon2-cffi>=23,<26",
  "keyring>=25,<27",
]

[project.optional-dependencies]
models = ["sentence-transformers>=3,<6"]
speech = [
  "pywhispercpp>=1.3,<2",
  "torch>=2.5,<3",
  "onnxruntime>=1.20,<2",
  "sounddevice>=0.5,<1",
  "scipy>=1.13,<2",
]

[project.scripts]
decanat = "decanat.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1", "cmake>=3.31,<5", "meson>=1.7,<2", "ninja>=1.11,<2"]

[tool.hatch.build.targets.wheel]
packages = ["backend/src/decanat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"backend/src/decanat/server.py" = ["B008"]

